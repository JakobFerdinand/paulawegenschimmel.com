<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paula Wegenschimmel</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👩‍💻</text></svg>">

    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        function toggleTheme() {
            const isDarkMode = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        }
    </script>
</head>

<body class="flex justify-center items-center min-h-screen m-4 font-sans bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-colors duration-300">
    <button
        class="absolute top-7 right-7 bg-gray-800 dark:bg-gray-500 p-2 rounded-lg"
        onclick="toggleTheme()">
        <span class="block dark:hidden">🌙</span>
        <span class="hidden dark:block">☀️</span>
    </button>

    <div class="text-center max-w-md mx-auto">
        <h1 class="text-4xl font-bold mb-6 text-gray-900 dark:text-gray-100">Paula Wegenschimmel</h1>
        <p class="text-lg mb-8 text-gray-700 dark:text-gray-300">
            I am currently working at <strong class="text-blue-600 dark:text-blue-400">Pamapama</strong>
        </p>
        <a href="https://www.pamapama.com/" 
           target="_blank" 
           rel="noopener noreferrer"
           class="inline-block bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 shadow-lg hover:shadow-xl">
            Visit us at Pamapama
        </a>
    </div>
</body>

</html>
